name: Display Top Repositories

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch:

jobs:
  display_repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Display top repositories
        run: |
          echo "## Top Repositories" >> README.md
          echo "" >> README.md
          gh repo list <your-github-username> --limit 5 --json name,description,url | jq -r '.[] | "* [" + .name + "](" + .url + "): " + .description' >> README.md
          echo "" >> README.md
          echo "Last updated: $(date)" >> README.md

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "Update README with top repositories"
          git push